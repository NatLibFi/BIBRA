version: 2

multi-ecosystem-groups:
  all:
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 10

updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/workflows"
    patterns:
      - "*"
    multi-ecosystem-group: "all"
  - package-ecosystem: "uv"
    directories:
      - "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all"
  - package-ecosystem: "npm"
    directories:
      - "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all"
