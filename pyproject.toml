[project]
name = "bibra"
version = "0.3.0.dev0"
description = "Tool for bibliographic metadata extraction"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "National Library of Finland", email = "finto-posti@helsinki.fi" }]
maintainers = [
    { name = "Osma Suominen", email = "osma.suominen@helsinki.fi" },
    { name = "Juho Inkinen", email = "juho.inkinen@helsinki.fi" },
    { name = "Unni Kohonen", email = "unni.kohonen@helsinki.fi" },
    { name = "Mona Lehtinen", email = "mona.lehtinen@helsinki.fi" },
]
keywords = [
    "bibliographic-metadata",
    "cataloging",
    "code4lib",
    "library-science",
    "metadata",
    "metadata-extraction",
    "rest-api",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "click>=8.5.1",
    "fastapi==0.163.1",
    "pydantic>=2.14.3",
    "pydantic-ai-slim[openai]>=2.69.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "uvicorn==0.54.0",
    "pymupdf>=2.1",
    "pymupdf4llm>=2.1",
    "regex>=2026.11.15",
    "tiktoken>=0.12.0",
    "httpx2>=2.16.2",
    "bibraeval>=0.1.0",
]

[project.scripts]
bibra = "bibra.cli:cli"

[project.urls]
repository = "https://github.com/NatLibFi/BIBRA"
changelog = "https://github.com/NatLibFi/BIBRA/releases"
documentation = "https://github.com/NatLibFi/BIBRA/wiki"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.0.0",
    "ruff~=0.16.0",
    "pre-commit>=4.7.0",
    "schemathesis>=4.33.4",
    "bump-my-version>=1.8.1",
    "ty==0.0.105",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "1 week"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set.
extend-select = ["E501"]

[tool.bumpversion]
current_version = "0.3.0.dev0"
parse = """(?x)
    (?P<major>0|[1-9]\\d*)\\.
    (?P<minor>0|[1-9]\\d*)\\.
    (?P<patch>0|[1-9]\\d*)
    (?:\\.dev(?P<release>\\d+))?
"""
serialize = [
    "{major}.{minor}.{patch}.dev{release}",
    "{major}.{minor}.{patch}",
]
tag = true
sign_tags = true
commit = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "uv.lock"
search = "name = \"bibra\"\nversion = \"{current_version}\""
replace = "name = \"bibra\"\nversion = \"{new_version}\""

[tool.bumpversion.parts.release]
values = ["0", "1"]
optional_value = "1"
first_value = "0"
