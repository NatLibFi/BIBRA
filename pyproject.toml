[project]
name = "bibra"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "fastapi==0.136.1",
    "pydantic-ai-slim[openai]>=1.93.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.28",
    "uvicorn==0.46.0",
    "pymupdf>=1.27.2",
    "pymupdf4llm>=1.27.2",
    "regex>=2026.5.9",
    "tiktoken>=0.12.0",
]

[project.scripts]
bibra = "bibra.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.28.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.12",
    "pre-commit>=4.6.0",
    "schemathesis>=4.18.1",
    "bump-my-version>=1.3.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set.
extend-select = ["E501"]

[tool.setuptools.packages.find]
include = ["bibra*"]

[tool.bumpversion]
current_version = "0.1.0"
parse = """(?x)
    (?P<major>0|[1-9]\\d*)\\.
    (?P<minor>0|[1-9]\\d*)\\.
    (?P<patch>0|[1-9]\\d*)
    (?:
        -                             # dash separator for pre-release section
        (?P<pre_l>[a-zA-Z-]+)         # pre-release label
        (?P<pre_n>0|[1-9]\\d*)        # pre-release version number
    )?                                # pre-release section is optional
"""
serialize = [
    "{major}.{minor}.{patch}-{pre_l}{pre_n}",
    "{major}.{minor}.{patch}",
]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = false
message = "Bump version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []
allow_shell_hooks = true

[tool.bumpversion.parts.pre_l]
values = ["dev"]
