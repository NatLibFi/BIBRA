[project]
name = "bibra"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "fastapi==0.136.1",
    "pydantic-ai-slim[openai]>=1.93.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.28",
    "uvicorn==0.46.0",
    "pymupdf>=1.27.2",
    "pymupdf4llm>=1.27.2",
    "regex>=2026.5.9",
    "tiktoken>=0.12.0",
]

[project.scripts]
bibra = "bibra.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.28.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.12",
    "pre-commit>=4.6.0",
    "schemathesis>=4.18.1",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set.
extend-select = ["E501"]

[tool.setuptools.packages.find]
include = ["bibra*"]
